name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (Hardened)
        env:
          GITLEAKS_VERSION: "8.18.2"
          GITLEAKS_SHA256: "119615a631fdf796b4bfad146d616eb8b1394c840c88939c4a854972f0dbb7ee"
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          TARBALL="${TEMP_DIR}/gitleaks.tar.gz"
          
          curl --fail --proto '=https' --tlsv1.2 -sSL             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             -o "$TARBALL"

          (cd "$TEMP_DIR" && echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -)

          tar -xzf "$TARBALL" -C "$TEMP_DIR" gitleaks
          sudo mv "${TEMP_DIR}/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          rm -rf "$TEMP_DIR"

      - name: Run Gitleaks secret scan
        run: |
          gitleaks detect             --source .             --config .gitleaks.toml             --redact             --verbose
