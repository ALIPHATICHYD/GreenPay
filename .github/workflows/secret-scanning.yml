name: Secret Scanning

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        # gitleaks/gitleaks-action@v3 requires a paid GITLEAKS_LICENSE for
        # organization-owned repos (github.com/gitleaks/gitleaks-action#-announcement).
        # The underlying gitleaks CLI itself is free/open-source — run it
        # directly instead of through the licensed Action wrapper.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose
