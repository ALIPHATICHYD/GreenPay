name: Secret Scanning

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks (Hardened)
        env:
          GITLEAKS_VERSION: "8.18.2"
          GITLEAKS_SHA256: "947321e1e488152e90e7a17730e2518e3dd56720d2b7ac9a0937a435850e0f39"
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          TARBALL="${TEMP_DIR}/gitleaks.tar.gz"
          
          curl --fail --proto '=https' --tlsv1.2 -sSL             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             -o "$TARBALL"

          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -

          tar -xzf "$TARBALL" -C "$TEMP_DIR" gitleaks
          sudo mv "${TEMP_DIR}/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          rm -rf "$TEMP_DIR"

          gitleaks detect \n            --source . \n            --config .gitleaks.toml \n            --redact \n            --verbose
