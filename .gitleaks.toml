title = "Stellar GreenPay secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated distributable archives are not source files to scan."
paths = [
  '''^extension/greenpay-extension\.zip$''',
]

[[allowlists]]
description = "Environment templates contain placeholder-only values for contributors."
condition = "AND"
paths = [
  '''(^|/)\.env\.example$''',
]
regexes = [
  '''(?i)(yourdomain\.com|YOUR_PUBLIC_ADDRESS|YOUR_|PLACEHOLDER|example(?:\.com)?|localhost|testnet|postgres:postgres)''',
  '''^$''',
]

[[allowlists]]
description = "Automated tests and mocks use deterministic dummy identifiers."
condition = "AND"
paths = [
  '''(^|/)(__tests__|__mocks__|e2e|test_snapshots)(/|$)''',
  '''\.(test|spec)\.(js|ts|tsx)$''',
]
regexes = [
  '''(?i)(mock|dummy|fixture|example|test|aaaaaaaa|bbbbbbbb|cccccccc)''',
]

# Stellar secret seeds are this project's most sensitive credential type and
# the default ruleset does not detect them at all — verified by planting one
# and watching a full scan report no leaks.
[[rules]]
id = "stellar-secret-seed"
description = "Stellar secret seed (ed25519 private key)"
regex = '''\bS[A-Z2-7]{55}\b'''
keywords = ["S"]

[[rules.allowlists]]
description = """
The logger's redaction guard tests need a secret-shaped fixture to prove that
private keys are scrubbed. This is a sequential-alphabet dummy, not a
checksum-valid seed, and is matched by its exact literal value.
"""
regexTarget = "match"
regexes = ['''SABCDEFGHIJKLMNOPQRSTUVWXYZ234567ABCDEFGHIJKLMNOPQRSTUVW''']
