namespace: greenpay

backend:
  image: greenpay/backend:latest
  replicas: 2
  port: 4000
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      latencyP99Threshold: 500
      interval: 1m
      count: 5
      failureLimit: 3

frontend:
  image: greenpay/frontend:latest
  replicas: 2
  port: 3000
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      interval: 1m
      count: 5
      failureLimit: 3

monitoring:
  namespace: monitoring
  prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  walBucket: greenpay-wal-backups
  awsRegion: us-east-1

config:
  stellarNetwork: testnet
  horizonUrl: https://horizon-testnet.stellar.org
  sorobanRpcUrl: https://soroban-testnet.stellar.org
  contractId: ""
  usdcIssuer: ""
  emailFrom: "GreenPay <updates@yourdomain.com>"

secrets:
  postgresUser: postgres
  postgresPassword: changeme
  postgresDb: greenpay
  resendApiKey: ""
  adminApiKey: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

ingress:
  host: greenpay.local
  className: nginx
